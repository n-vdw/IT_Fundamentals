<!DOCTYPE html>
<html>
  <head>
    <title>IT Fundamentals</title>
    <style>
      body {
        background-color: #d9d9d9;
      }

      .header-box {
        position: relative;
        width: fit-content;
        margin: 40px auto;
        padding: 10px;
        border: 1px solid #333;
        background-color: white;
      }

      h1 {
        text-align: center;
        margin: 0;
      }

      .corner-gif {
        position: absolute;
        top: -16px;
        left: -164px;
        width: 128px;
      }

      .main-image {
        display: block;
        margin: 20px auto;
        width: 300px;
      }
    </style>
  </head>

  <body>
    <div class="header-box">
      <img class="corner-gif" src="images/b64.gif" alt="GIF">
      <h1>Simpele webpagina voor IT Fundamentals</h1>
    </div>

    <img class="main-image" src="images/apple2.jpg" alt="Main image">
  </body>
</html>
